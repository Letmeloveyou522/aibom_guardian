name: 버그 제보
description: 실행 오류, 잘못된 결과, 문서와 다른 동작 제보
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        보안 취약점은 여기가 아니라 [SECURITY.md](../blob/main/SECURITY.md)의
        비공개 신고 절차를 이용해 주세요. 위험한 대상을 안전하다고 판정하게
        만드는 입력도 보안 문제에 포함됩니다.

  - type: textarea
    id: what-happened
    attributes:
      label: 무슨 일이 일어났나요
      description: 기대한 동작과 실제 동작을 함께 적어 주세요.
      placeholder: |
        pyyaml==5.3.1 을 검사했는데 BLOCK이 나와야 할 것 같은데 ALLOW가 나옵니다.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: |
        실행한 명령과 입력 파일 내용을 그대로 붙여 주세요.
        `--offline`에서도 재현되는지 함께 확인해 주세요.
      value: |
        ```bash
        aibom-guardian requirements.txt
        ```

        requirements.txt 내용:
        ```

        ```
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: 출력
      description: |
        터미널 출력과 traceback을 붙여 주세요. `scan_report.json`에 해당
        패키지 항목이 있으면 함께 첨부해 주세요.
      render: shell

  - type: input
    id: version
    attributes:
      label: 버전
      description: "`aibom-guardian --version` 또는 커밋 해시"
      placeholder: "1.0.0 / 3e37fae"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: OS와 Python 버전
      placeholder: "Windows 11 / Python 3.12.4"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: "`pytest`를 돌려봤고, 통과 여부를 위에 적었습니다"
        - label: 같은 내용의 이슈가 이미 있는지 찾아봤습니다
