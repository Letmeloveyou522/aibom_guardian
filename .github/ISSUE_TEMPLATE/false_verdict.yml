name: 판정 오류 제보
description: 정상 항목이 위험하다고 표시된 경우
labels: ["verdict"]
body:
  - type: markdown
    attributes:
      value: |
        실제 위험을 발견하지 못한 경우에는 공개 이슈를 작성하지 말고
        [SECURITY.md](../blob/main/SECURITY.md)의 비공개 신고 절차를 이용해 주세요.
        정상 항목이 위험하다고 표시된 경우에는 이 양식으로 제보해 주세요.

  - type: dropdown
    id: kind
    attributes:
      label: 오류가 발생한 항목
      options:
        - 라이선스 (ALLOWED / REVIEW / BLOCKED / UNKNOWN)
        - 취약점 (CVE 개수, 심각도, 중복 계산)
        - 타이포스쿼팅
        - 환각 패키지 (PyPI 미등록 판정)
        - 모델 (가중치 형식, 원격 코드, Model Card)
        - Trust Score / 최종 verdict
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: 검사 대상
      description: 패키지 또는 모델의 이름과 버전을 입력해 주세요.
      placeholder: "chardet==5.2.0 또는 CompVis/stable-diffusion-v1-4"
    validations:
      required: true

  - type: input
    id: actual
    attributes:
      label: 현재 검사 결과
      placeholder: "라이선스 상태: ALLOWED / SPDX: MIT"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 결과와 근거
      description: |
        올바른 판정을 확인할 수 있는 근거 링크를 함께 적어 주세요.

        - 라이선스: PyPI 페이지, 저장소의 LICENSE 파일, SPDX 식별자
        - 취약점: OSV / GHSA / CVE 링크
      placeholder: |
        LGPL-2.1 이어야 합니다.
        https://pypi.org/project/chardet/5.2.0/ 의 Classifier 참고
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: scan_report.json의 해당 항목
      description: |
        원인 확인을 위해 `license_source`, `score_breakdown`,
        `confidence` 필드가 포함된 항목을 붙여 주세요.
      render: json
