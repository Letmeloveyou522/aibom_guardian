name: 판정 오류 (오탐 / 미탐)
description: 라이선스·취약점·타이포스쿼팅 판정이 틀렸을 때
labels: ["verdict"]
body:
  - type: markdown
    attributes:
      value: |
        판정 정확도는 이 도구의 존재 이유라서 별도 양식으로 받습니다.

        **위험한 것을 안전하다고 보고하는 경우(미탐)는 보안 문제로 취급합니다.**
        공개 이슈 대신 [SECURITY.md](../blob/main/SECURITY.md)를 따라 주십시오.
        안전한 것을 위험하다고 보고하는 경우(오탐)는 여기가 맞습니다.

  - type: dropdown
    id: kind
    attributes:
      label: 어느 판정인가요
      options:
        - 라이선스 (ALLOWED / REVIEW / BLOCKED / UNKNOWN)
        - 취약점 (CVE 개수, 심각도, 중복 계산)
        - 타이포스쿼팅
        - 환각 패키지 (PyPI 미등록 판정)
        - 모델 (가중치 형식, 원격 코드, Model Card)
        - Trust Score / 최종 verdict
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: 검사 대상
      description: 패키지 또는 모델을 버전까지 정확히
      placeholder: "chardet==5.2.0 또는 CompVis/stable-diffusion-v1-4"
    validations:
      required: true

  - type: input
    id: actual
    attributes:
      label: 이 도구가 낸 판정
      placeholder: "ALLOWED / spdx=MIT"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 올바른 판정과 근거
      description: |
        **근거 링크를 함께 주십시오.** 이 도구는 추측하지 않고 출처를 근거로
        판정하므로, 수정도 출처가 있어야 합니다.

        - 라이선스: PyPI 페이지, 저장소의 LICENSE 파일, SPDX 식별자
        - 취약점: OSV / GHSA / CVE 링크
      placeholder: |
        LGPL-2.1 이어야 합니다.
        https://pypi.org/project/chardet/5.2.0/ 의 Classifier 참고
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: scan_report.json의 해당 항목
      description: |
        `license_source`, `score_breakdown`, `confidence` 필드가 원인을
        바로 보여줄 때가 많습니다.
      render: json
