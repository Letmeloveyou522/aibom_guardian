name: 기능 제안
description: 새로운 검사 기능이나 사용 방식 제안
labels: ["enhancement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 불편한 점이나 지원이 필요한 상황을 적어 주세요.
      placeholder: |
        사내 패키지 미러를 사용하는 경우 실제 설치 버전과 검사 결과가 다르게 나옵니다.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 원하는 동작
      description: 기대하는 동작이나 사용 방식을 적어 주세요.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 관련 기능
      options:
        - 패키지 검사
        - 라이선스 판정
        - AI 모델 검사
        - 저장소 및 출처 검사
        - Trust Score
        - SBOM 및 ML-BOM
        - CLI
        - MCP
        - 기타
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 확인
      options:
        - label: 같은 내용의 이슈가 이미 있는지 확인했습니다
          required: true