name: Release

on:
  push:
    tags:
      - 'v*.*.*'   # A version tag publishes a release.
  workflow_dispatch:

jobs:
  # A tag is usually pushed from a branch someone believes is green. A
  # released artifact is a bad place to find out otherwise.
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q

  publish:
    name: Build and publish release
    runs-on: ubuntu-latest
    needs: test

    # Creating a release is a write, and GITHUB_TOKEN defaults to read-only in
    # many repositories - without this the last step 403s.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the distributions are well-formed
        run: python -m twine check dist/*

      - name: Verify the tag matches the packaged version
        # Reject a tag that does not match the version built into the package.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | sed -E 's/.*aibom_guardian-([^-]+)-.*/\1/')
          echo "tag=$tag built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packaged version $built (see src/aibom_guardian/__init__.py)"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
