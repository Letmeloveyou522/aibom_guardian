name: AIBOM-Guard
description: >-
  Scan Python requirements and Hugging Face models for vulnerabilities,
  license restrictions and supply-chain risk. Emits a CycloneDX SBOM and
  optional SARIF.
author: AIBOM-Guard contributors

branding:
  icon: shield
  color: green

inputs:
  requirements:
    description: Path to the requirements file to scan.
    required: false
    default: requirements.txt
  fail-on:
    description: >-
      When to fail the step: block (only hard blocks), warning (default,
      also fails on unverified findings), or never.
    required: false
    default: warning
  direct-only:
    description: Scan only the listed packages, not what they pull in.
    required: false
    default: 'false'
  supply-chain:
    description: Also check repository trust. Slow; set GITHUB_TOKEN.
    required: false
    default: 'false'
  min-release-age:
    description: >-
      Warn about versions published fewer than this many days ago.
      0 disables. A compromised release is usually pulled within hours.
    required: false
    default: '0'
  jobs:
    description: Concurrent lookups.
    required: false
    default: '8'
  sarif-file:
    description: Where to write SARIF. Empty disables SARIF output.
    required: false
    default: aibom-guard.sarif
  sbom-file:
    description: Where to write the CycloneDX SBOM.
    required: false
    default: sbom.json
  report-file:
    description: Where to write the full JSON report.
    required: false
    default: scan_report.json
  python-version:
    description: Python used to run the scanner.
    required: false
    default: '3.12'

outputs:
  exit-code:
    description: 0 clean, 2 a BLOCK was found, 3 warnings or unscanned lines.
    value: ${{ steps.scan.outputs.exit-code }}
  sarif-file:
    description: Path to the SARIF file, when one was written.
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install AIBOM-Guard
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Scan
      id: scan
      shell: bash
      env:
        # Passed through so --supply-chain does not hit GitHub's rate limit.
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
      run: |
        args=("${{ inputs.requirements }}" --no-explain)
        args+=(--fail-on "${{ inputs.fail-on }}")
        args+=(--jobs "${{ inputs.jobs }}")
        args+=(--json "${{ inputs.report-file }}")
        args+=(--sbom "${{ inputs.sbom-file }}")
        args+=(--min-release-age "${{ inputs.min-release-age }}")
        [ "${{ inputs.direct-only }}" = "true" ] && args+=(--direct-only)
        [ "${{ inputs.supply-chain }}" = "true" ] && args+=(--supply-chain)
        [ -n "${{ inputs.sarif-file }}" ] && args+=(--sarif "${{ inputs.sarif-file }}")

        set +e
        aibom-guard "${args[@]}"
        code=$?
        set -e

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "sarif-file=${{ inputs.sarif-file }}" >> "$GITHUB_OUTPUT"
        exit $code
