name: AIBOM-Guardian
description: >-
  Scan Python requirements for vulnerabilities, license issues, and
  supply-chain risks. Generate CycloneDX SBOM, JSON, and optional SARIF reports.
author: AIBOM-Guardian contributors

branding:
  icon: shield
  color: green

inputs:
  requirements:
    description: Path to the requirements file to scan.
    required: false
    default: requirements.txt
  fail-on:
    description: >-
      Failure policy: warning fails on WARNING or BLOCK, block fails only on
      BLOCK, and never reports findings without failing the scan.
    required: false
    default: warning
  direct-only:
    description: Scan only the listed packages, not what they pull in.
    required: false
    default: 'false'
  supply-chain:
    description: Also check repository trust. GITHUB_TOKEN is recommended.
    required: false
    default: 'false'
  min-release-age:
    description: >-
      Warn about versions published fewer than this many days ago.
      Set to 0 to disable this check.
    required: false
    default: '0'
  jobs:
    description: Concurrent lookups.
    required: false
    default: '8'
  sarif-file:
    description: Where to write SARIF. Empty disables SARIF output.
    required: false
    default: aibom-guardian.sarif
  sbom-file:
    description: Where to write the CycloneDX SBOM.
    required: false
    default: sbom.json
  report-file:
    description: Where to write the full JSON report.
    required: false
    default: scan_report.json
  python-version:
    description: Python used to run the scanner.
    required: false
    default: '3.12'

outputs:
  exit-code:
    description: "Scanner exit code: 0 clean, 1 input error, 2 block, 3 warning or unscanned input."
    value: ${{ steps.scan.outputs.exit-code }}
  sarif-file:
    description: Path to the SARIF file, when one was written.
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install AIBOM-Guardian
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Scan
      id: scan
      shell: bash
      env:
        # Passed through so --supply-chain does not hit GitHub's rate limit.
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
      run: |
        args=("${{ inputs.requirements }}" --no-explain)
        args+=(--fail-on "${{ inputs.fail-on }}")
        args+=(--jobs "${{ inputs.jobs }}")
        args+=(--json "${{ inputs.report-file }}")
        args+=(--sbom "${{ inputs.sbom-file }}")
        args+=(--min-release-age "${{ inputs.min-release-age }}")
        [ "${{ inputs.direct-only }}" = "true" ] && args+=(--direct-only)
        [ "${{ inputs.supply-chain }}" = "true" ] && args+=(--supply-chain)
        [ -n "${{ inputs.sarif-file }}" ] && args+=(--sarif "${{ inputs.sarif-file }}")

        set +e
        aibom-guardian "${args[@]}"
        code=$?
        set -e

        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "sarif-file=${{ inputs.sarif-file }}" >> "$GITHUB_OUTPUT"
        exit $code
